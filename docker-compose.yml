services:
  text-audit-service:
    build:
      context: ./services/text-audit
    container_name: content-review-text-audit
    environment:
      CONFIG_DIR: /app/configs
      POLICY_VERSION: "2026.06.24"
      TEXT_AUDIT_ENABLE_MODEL: "false"
    ports:
      - "8010:8010"
    volumes:
      - ./configs:/app/configs:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010

  image-audit-service:
    build:
      context: ./services/image-audit
    container_name: content-review-image-audit
    environment:
      CONFIG_DIR: /app/configs
      PROJECT_ROOT: /app
      POLICY_VERSION: "2026.06.24"
      TEXT_AUDIT_URL: "http://text-audit-service:8010/v1/moderation/text"
      IMAGE_AUDIT_ENABLE_OCR: "true"
      IMAGE_AUDIT_OCR_PROVIDER: "paddleocr"
      IMAGE_AUDIT_ENABLE_NSFW_MODEL: "true"
      IMAGE_AUDIT_NSFW_MODEL_NAME: "storage/models/falconsai-nsfw"
      IMAGE_AUDIT_NSFW_DEVICE: "-1"
      IMAGE_AUDIT_NSFW_DOWNLOAD_ON_REQUEST: "false"
      IMAGE_AUDIT_ENABLE_NUDENET: "true"
      IMAGE_AUDIT_ENABLE_VISION_SAFETY: "true"
      IMAGE_AUDIT_VISION_SAFETY_PROVIDER: "shieldgemma2_local"
      IMAGE_AUDIT_VISION_SAFETY_MODEL_NAME: "storage/models/shieldgemma-2-4b-it"
      IMAGE_AUDIT_VISION_SAFETY_DEVICE: "auto"
      IMAGE_AUDIT_VISION_SAFETY_ALLOW_CPU: "false"
      IMAGE_AUDIT_VISION_SAFETY_TRIGGER_MODE: "gray"
      IMAGE_AUDIT_VISION_SAFETY_REVIEW_ON_UNAVAILABLE: "true"
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_ETAG_TIMEOUT: "5"
      HF_HUB_DOWNLOAD_TIMEOUT: "30"
    ports:
      - "8020:8020"
    volumes:
      - ./configs:/app/configs:ro
      - ./storage/models:/app/storage/models:ro
    depends_on:
      - text-audit-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8020

  video-audit-service:
    build:
      context: ./services/video-audit
    container_name: content-review-video-audit
    environment:
      CONFIG_DIR: /app/configs
      PROJECT_ROOT: /app
      POLICY_VERSION: "2026.06.24"
      IMAGE_AUDIT_URL: "http://image-audit-service:8020/v1/moderation/image/upload"
      TEXT_AUDIT_URL: "http://text-audit-service:8010/v1/moderation/text"
      VIDEO_AUDIT_MAX_DURATION_SECONDS: "60"
      VIDEO_AUDIT_FRAME_SAMPLE_FPS: "1"
      VIDEO_AUDIT_MAX_SAMPLED_FRAMES: "60"
      VIDEO_AUDIT_FRAME_SKIP_OCR: "true"
      VIDEO_AUDIT_STOP_ON_BLOCK: "false"
      VIDEO_AUDIT_SELECTIVE_OCR_ENABLED: "true"
      VIDEO_AUDIT_SELECTIVE_OCR_MAX_FRAMES: "2"
      VIDEO_AUDIT_SELECTIVE_OCR_INCLUDE_FIRST_FRAME: "true"
      VIDEO_AUDIT_SELECTIVE_OCR_INCLUDE_LAST_FRAME: "false"
      VIDEO_AUDIT_SELECTIVE_OCR_MIN_INTERVAL_SECONDS: "2"
      VIDEO_AUDIT_SELECTIVE_OCR_TEXT_REGION_ENABLED: "true"
      VIDEO_AUDIT_SELECTIVE_OCR_RETRY_ON_QR_OR_RISK: "true"
    ports:
      - "8030:8030"
    volumes:
      - ./configs:/app/configs:ro
    depends_on:
      - text-audit-service
      - image-audit-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8030
