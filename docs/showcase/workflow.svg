<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">一个入口，三条审核链路</title><desc id="desc">网关负责路由与异步任务；各媒体服务独立运行；业务输入 → 统一网关 · 8040 → 按媒体分析 → 统一响应</desc>
<rect width="1200" height="340" rx="20" fill="#f8fafc"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:30px;font-weight:700;fill:#172b40}.sub{font-size:17px;fill:#536477}.label{font-size:22px;font-weight:650;fill:#172b40}.small{font-size:16px;fill:#536477}</style>
<rect x="36" y="34" width="5" height="32" rx="2" fill="#7354a1"/><text class="title" x="57" y="61">一个入口，三条审核链路</text>
<text class="sub" x="37" y="94">网关负责路由与异步任务；各媒体服务独立运行</text>
<rect x="36" y="126" width="252" height="138" rx="12" fill="white" stroke="#dbe3eb"/><circle cx="64" cy="154" r="13" fill="#7354a1"/><text x="64" y="160" text-anchor="middle" fill="white" font-size="16">1</text><text class="label" x="56" y="197">业务输入</text><text class="small" x="56" y="225">文字 / 图片 / 视频</text><text class="small" x="56" y="248">测试台或 HTTP API</text>
<path d="M296 193h22m-7-7 7 7-7 7" fill="none" stroke="#7354a1" stroke-width="3"/>
<rect x="328" y="126" width="252" height="138" rx="12" fill="white" stroke="#dbe3eb"/><circle cx="356" cy="154" r="13" fill="#7354a1"/><text x="356" y="160" text-anchor="middle" fill="white" font-size="16">2</text><text class="label" x="348" y="197">统一网关 · 8040</text><text class="small" x="348" y="225">同步或异步提交</text><text class="small" x="348" y="248">同端口查询结果</text>
<path d="M588 193h22m-7-7 7 7-7 7" fill="none" stroke="#7354a1" stroke-width="3"/>
<rect x="620" y="126" width="252" height="138" rx="12" fill="white" stroke="#dbe3eb"/><circle cx="648" cy="154" r="13" fill="#7354a1"/><text x="648" y="160" text-anchor="middle" fill="white" font-size="16">3</text><text class="label" x="640" y="197">按媒体分析</text><text class="small" x="640" y="225">文本 · OCR · 视频抽帧</text><text class="small" x="640" y="248">模型与 ASR 按配置启用</text>
<path d="M880 193h22m-7-7 7 7-7 7" fill="none" stroke="#7354a1" stroke-width="3"/>
<rect x="912" y="126" width="252" height="138" rx="12" fill="white" stroke="#dbe3eb"/><circle cx="940" cy="154" r="13" fill="#7354a1"/><text x="940" y="160" text-anchor="middle" fill="white" font-size="16">4</text><text class="label" x="932" y="197">统一响应</text><text class="small" x="932" y="225">allow / review / block</text><text class="small" x="932" y="248">风险等级与中文原因</text>
<text class="small" x="37" y="307">本地演示只运行文本规则/启发式链路；人工审核后台仍为规划能力。</text></svg>
